name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Real environment variables take precedence over .env (which is not committed)
  APP_SECRET: ci-test-secret
  API3_URL: https://api3.example.test
  CHAT_API_KEY: ci
  API2_LOGIN_NICKNAME: ci
  API2_LOGIN_PASSWORD: ci

jobs:
  quality:
    name: PHP static analysis and linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Prepare environment
        # .env is not committed; real environment variables above supply all values
        run: touch .env

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Lint container
        run: php bin/console lint:container --env=test

      - name: Lint YAML and Twig
        run: |
          php bin/console lint:yaml config --env=test
          php bin/console lint:twig templates --env=test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secret scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Composer security audit
        run: composer audit

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: npm security audit
        run: npm audit --omit=dev
